<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>NOVA AI</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="sidebar-top">

            <div class="nova-logo">
                ✦ NOVA
            </div>


            <button class="new-chat">
                + New chat
            </button>

        </div>


        <!-- CHAT HISTORY -->

        <div class="chat-history">

            <p class="history-title">
                Recent
            </p>

        </div>


        <!-- SIDEBAR BOTTOM -->

        <div class="sidebar-bottom">

            <button class="sidebar-button">
                ⚙ Settings
            </button>

            <button class="sidebar-button">
                👤 About NOVA
            </button>


            <div class="creator">

                <span>
                    MADE BY
                </span>

                <strong>
                    D.N. MAADESH
                </strong>

            </div>

        </div>

    </aside>



    <!-- =========================
         MAIN CHAT
    ========================== -->

    <main class="chat-area">


        <!-- TOP BAR -->

        <header class="topbar">

            <div class="mobile-logo">
                ✦ NOVA
            </div>

            <div class="model-name">
                NOVA
            </div>

        </header>



        <!-- MESSAGES -->

        <section class="messages">

            <div class="welcome">

                <div class="nova-symbol">
                    ✦
                </div>

                <h1>
                    How can I help you?
                </h1>

                <p>
                    I'm NOVA, your AI assistant.
                </p>

            </div>

        </section>



        <!-- =========================
             INPUT AREA
        ========================== -->

        <div class="input-area">

            <div class="input-box">


                <textarea
                    id="messageInput"
                    placeholder="Message NOVA..."
                    rows="1"
                ></textarea>


                <!-- MICROPHONE BUTTON -->

                <button
                    id="micButton"
                    type="button"
                    title="Voice input"
                >
                    🎤
                </button>


                <!-- VOICE OUTPUT BUTTON -->

                <button
                    id="voiceButton"
                    type="button"
                    title="Voice response OFF"
                >
                    🔇
                </button>


                <!-- SEND BUTTON -->

                <button
                    id="sendButton"
                    type="button"
                    title="Send message"
                >
                    ↑
                </button>


            </div>


            <p class="disclaimer">

                NOVA can make mistakes.
                Check important information.

            </p>

        </div>

    </main>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
